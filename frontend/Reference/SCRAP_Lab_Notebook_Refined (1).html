<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>SCRAP — Research Assistant for Analyzing RNA-seq</title>
  <style>
    /* -----------------------------------------------------------------
       SCRAP / laboratory notebook — standalone static design reference.
       Everything is local. No network requests, libraries, or server.
       Primary target: 1440 × 900. Dimensions are intentionally more
       compact than the supplied 1672 × 941 screenshot.
       ----------------------------------------------------------------- */
    :root {
      --paper: #f7f5ef;
      --paper-raised: #fbfaf5;
      --paper-side: #f7f7f1;
      --ink: #13325d;
      --ink-soft: #8190a8;
      --blue: #6096e4;
      --blue-mid: #83b0ed;
      --blue-pale: #e4eefb;
      --outline: #d8d9d4;
      --rose: #edbcc0;
      --dots: rgba(76, 91, 105, .18);
      --sidebar-width: clamp(274px, 22.4vw, 323px);
      --hand: "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
      --scale-font: 15px;
      --s: 10px;
      --small-radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-width: 700px; background: #d6d0c5;
      color: var(--ink); font-family: var(--hand); font-size: var(--scale-font);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #659de7; outline-offset: 3px; }
    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0 }
    .icon { height: 20px; width: 20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .icon--lg { width:24px; height:24px; }
    .icon--sm { width:16px;height:16px; }
    .symbols { position:absolute;width:0;height:0;overflow:hidden; }

    /* Paper grain and subtle notebook backgrounds are real CSS textures. */
    .workbook {
      display:flex; position:relative; isolation:isolate;
      height:100vh; min-height:640px; max-height:1400px; width:100%; overflow:hidden;
      border: 1px solid #d7d3c9; border-radius: 13px;
      background: var(--paper);
      box-shadow: inset 0 0 10px #bcb5a850, 0 1px 5px #887e6e2b;
    }
    .workbook::after {
      content:"";position:absolute;inset:0;pointer-events:none;z-index:12;opacity:.2;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' seed='11' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.17'/%3E%3C/svg%3E");
      mix-blend-mode:multiply;
    }
    aside.sidebar {
      flex: 0 0 var(--sidebar-width); width:var(--sidebar-width);
      position:relative; display:flex; flex-direction:column; min-width:0;z-index:4;
      padding: 19px 15px 18px;
      border-right: 1px solid #c1bdb3;
      border-radius: 11px 10px 13px 11px;
      box-shadow: 3px 1px 6px rgba(67,55,47,.14), inset -2px 0 5px #9b958521;
      background-color:var(--paper-side);
      background-image:
        repeating-linear-gradient(to bottom, transparent 0px,transparent 31px,rgba(126,150,182,.055) 32px,transparent 33px),
        repeating-linear-gradient(to right, transparent 0px,transparent 32px,rgba(160,165,169,.035) 33px,transparent 34px);
    }
    .sidebar::before {
      content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
      border-radius:inherit;
      background:linear-gradient(to right,rgba(255,255,255,.7),transparent 22%,transparent 80%,rgba(160,146,118,.09));
    }
    .sidebar > * { position:relative;z-index:1; }
    .brand { display:flex;align-items:flex-start;gap:12px;min-height:64px; }
    .brand-logo {width:49px;height:55px;object-fit:contain;flex-shrink:0;}
    .brand-copy { min-width:0; padding-top:1px; }
    .brand-name {font-size:26px;line-height:1;letter-spacing:.8px;font-weight:700; transform:rotate(-2deg); display:inline-block;}
    .brand-description { color:#697b98;font-size:13px;line-height:1.25; margin-top:5px;letter-spacing:.1px; }
    .brand-collapse { border:0;background:transparent;margin-left:auto;padding:2px;color:var(--ink); }
    .brand-collapse svg{width:22px;height:22px;}
    .new-project {width:100%;height:53px;border:1px solid #719ee0;background:#9cc1f1;border-radius:10px;color:#fff;display:flex;align-items:center;gap:17px;padding:0 20px;font-size:19px;letter-spacing:.3px;box-shadow:0 2px 1px #98add15c,inset 0 1px 1px #e3edfcaa;position:relative;overflow:hidden;margin-top:5px;}
    .new-project::after {content:"";inset:0;position:absolute;pointer-events:none;background:repeating-linear-gradient(145deg,transparent 0px,transparent 2px,#3767c51a 2.4px,transparent 3.5px);opacity:.45;}
    .new-project .icon {width:25px;height:25px;stroke-width:1.8}
    .sidebar-heading { font-size:14px;font-weight:700;letter-spacing:.35px;border-bottom:1px solid #c9cfd6;margin:26px 4px 11px;padding:0 0 8px;text-transform:uppercase; }
    .projects {display:flex;flex-direction:column;gap:5px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#cdd4dc transparent;margin:0 -3px 8px;}
    .project {border:0;background:transparent;border-radius:7px;width:100%;display:flex;align-items:center;gap:15px;text-align:left;padding:10px 14px 9px; min-height:64px;flex-shrink:0;}
    .project .icon {width:24px;height:24px;stroke-width:1.65;color:#234775;}
    .project-meta { display:flex;flex:1;min-width:0;flex-direction:column;gap:2px;}
    .project-name {font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.18;}
    .project-time {font-size:14px;color:#7c8ba3;font-style:italic;line-height:1.05;}
    .project-selected {background:rgba(177,209,247,.28);position:relative;}
    .project-selected::before {content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:#5899f2;border-radius:6px;}
    .project-more {border:0;background:transparent;padding:2px;color:#183764;line-height:1;letter-spacing:1px;font-size:19px;}
    .sidebar-foot {margin-top:auto;display:flex;justify-content:space-between;gap:6px;position:relative;padding:15px 5px 4px;border-top:1px solid #ccd0d4;}
    .foot-link {border:0;background:transparent;display:flex;align-items:center;gap:8px;font-size:16px;padding:0;color:var(--ink);white-space:nowrap;}
    .foot-link svg{width:21px;height:21px;}

    /* Spirals sit OVER the seam between notebook pages. */
    .binding { position:absolute;left:calc(var(--sidebar-width) - 7px);top:0;bottom:0;width:43px;z-index:8;pointer-events:none; overflow:hidden;}
    .binding-loop {position:absolute;left:-11px;width:46px;height:20px;border-radius:50%;
      border:7px solid rgba(109,107,98,.58); border-left-width:9px; border-bottom-color:#a49e93; border-top-color:#8e8a80;
      box-shadow:2px 2px 2px #8a847d36, inset 1px 1px 2px #fff7ee45;
      background: transparent;transform:rotate(-6deg); }
    .binding-loop::before {content:"";position:absolute;left:2px;top:-4px;width:18px;height:5px; background:#faf9f3;opacity:.45;border-radius:50%;}

    .page {
      flex:1;min-width:0;position:relative;overflow:hidden;
      background-color:#f8f7f1;
      background-image: radial-gradient(var(--dots) .68px,transparent .9px), linear-gradient(90deg,transparent 0%,#efece435 65%,transparent 100%);
      background-size:21px 21px,100% 100%; background-position:12px 7px,0 0;
    }
    .page::before {content:"";position:absolute;left:0;top:0;bottom:0;width:48px;pointer-events:none;background:linear-gradient(90deg,#a9a29223,transparent 85%);}
    .topbar {height:63px;position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:19px 23px 0 62px;z-index:5;}
    .project-menu {padding:0 1px 5px;border:0;border-bottom:1.2px solid #304c76;background:transparent;font-weight:600;letter-spacing:.2px;font-size:21px;line-height:1.25;display:flex;align-items:center;gap:18px;}
    .project-menu .icon{width:15px;height:15px;}
    .top-actions {display:flex;gap:10px;margin-top:-7px;}
    .round-action {width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#eceef0ed;border:1px solid #d1d4d8;box-shadow:0 3px 4px #8c867929;}
    .round-action .icon{height:21px;width:21px;}

    /* Scientific diagrams are native inline SVG, not an image backdrop. */
    .doodle {position:absolute;pointer-events:none;opacity:.72;filter:blur(.08px);z-index:1;}
    .doodle text {font-family:var(--hand);fill:#7989a3;font-size:15px;}
    .doodle .ink{stroke:#8796ae;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;}
    .doodle .pink{stroke:#efc3c8;stroke-width:3;opacity:.78;}
    .doodle .blue{stroke:#99bee9;stroke-width:2;}
    .doodle--rna{left:6.6%;top:14.3%;width:241px;height:215px;}
    .doodle--heat{left:5.5%;top:48%;width:235px;height:175px;}
    .doodle--volcano{right:3.2%;top:13%;width:254px;height:240px;}
    .doodle--pathway{right:4%;bottom:18%;width:225px;height:144px;}
    .pink-tab {position:absolute;top:13%;right:-6px;width:25px;height:75px;background:#efd3d590;z-index:2;transform:rotate(1deg);}

    /* Central taped sheet: the only elevated content region. */
    .welcome-card {position:absolute;z-index:3;left:51%;top:45.5%;transform:translate(-50%,-50%);width:min(510px,55%);min-height:320px;padding:40px 18px 36px;text-align:center;background:#fcfaf5;box-shadow:0 5px 11px rgba(83,77,67,.13),0 1px 2px rgba(91,85,78,.1);border:1px solid #ebe7dc;}
    .welcome-card::before {content:"";position:absolute;inset:0;z-index:-1;opacity:.35;pointer-events:none;background-image:repeating-linear-gradient(17deg,transparent,transparent 2px,#e9e5dc44 3px,transparent 4px),repeating-linear-gradient(-19deg,transparent,transparent 5px,#ddd8c726 6px,transparent 7px);}
    .welcome-card::after {content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(240,234,226,.36);clip-path:polygon(0 1%,2% 0,15% 1%,34% 0,55% .6%,68% 0,89% .7%,100% 0,99% 22%,100% 49%,99% 80%,100% 99%,93% 100%,74% 99.7%,50% 100%,24% 99.6%,0 100%,.5% 76%,0 51%);}
    .tape {position:absolute;top:-21px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:124px;height:29px;z-index:5;background:#bcd5edaf;clip-path:polygon(1% 6%,99% 0%,97% 93%,1% 97%);background-image:repeating-linear-gradient(135deg,transparent 0, transparent 4px,rgba(255,255,255,.21) 5px,transparent 6px);}
    .logo-tile{width:105px;height:105px;border:1.5px solid #2f5286;border-radius:19px;display:grid;place-items:center;margin:-4px auto 23px;box-shadow:1px 2px 2px #8f908c32;}
    .logo-tile img{width:74px;height:83px;object-fit:contain;}
    .welcome-title {font-weight:700;font-size:40px;letter-spacing:-1px;line-height:1.12;white-space:nowrap;margin:0 auto 13px;}
    .welcome-title .accent {color:#6a9ce8;position:relative;display:inline-block;}
    .welcome-title .accent::after{position:absolute;content:"";height:3px;left:3px;right:-1px;bottom:-4px;background:#f2bfc7;border-radius:70% 10% 80% 20%;transform:rotate(-2.5deg);opacity:.86;}
    .welcome-subtitle{font-size:17px;font-weight:650;margin:15px auto 8px;white-space:nowrap;}
    .underlined{position:relative;white-space:nowrap;}
    .underlined:after{position:absolute;content:"";height:2px;left:0;right:-2px;bottom:-4px;transform:rotate(-1deg);background:#a6c9ec;}
    .welcome-description{font-size:16px;color:#8290a5;margin:12px auto 0;line-height:1.42;}

    .composer {position:absolute;z-index:6;left:37px;right:24px;bottom:24px;height:86px;display:flex;align-items:center;gap:19px;padding:9px 14px;background:#faf9f6;border:1px solid #d8d7d0;border-radius:17px;box-shadow:0 5px 9px #736c6220,0 1px 2px #8a857a25;}
    .composer::before {content:"";position:absolute;inset:8px;border:1px solid #d7d9dbb8;border-radius:13px;pointer-events:none;}
    .attach {height:53px;width:53px;display:grid;place-items:center;border-radius:13px;border:1px solid #d9dce2;background:#f2f3f3;z-index:1;box-shadow:0 2px 3px #9a979126;}
    .attach .icon{width:24px;height:24px;color:#244778;}
    .chat-input {border:0;background:transparent;resize:none;outline:0;flex:1;height:50px;min-width:0;line-height:50px;font-size:17px;padding:0 1px;color:#1d426f;overflow:hidden;z-index:1;}
    .chat-input::placeholder{color:#8190a8;opacity:1;}
    .send {width:56px;height:56px;border:0;border-radius:50%;display:grid;place-items:center;background:#649ae6;color:#fff;box-shadow:0 2px 2px #728cb44a;z-index:1;flex-shrink:0;}
    .send .icon{width:26px;height:26px;stroke-width:2;}

    @media (max-height:760px){
      .sidebar-heading{margin-top:17px;}
      .project{min-height:54px;padding-top:7px;padding-bottom:7px;}
      .welcome-card{top:45%;min-height:275px;padding-top:28px;padding-bottom:25px;}
      .logo-tile{width:88px;height:88px;margin-bottom:14px;}
      .logo-tile img{width:61px;height:70px;}
      .welcome-title{font-size:35px;}
      .doodle--heat{top:52%;}.doodle--pathway{bottom:16%;}
    }
    @media (max-width:1050px){
      :root{--sidebar-width:264px}
      .brand-description{font-size:11px;}.brand-name{font-size:22px;}
      .brand-logo{width:43px;height:50px;}.brand{gap:7px;}
      .welcome-card{width: min(490px,67%);}.welcome-title{font-size:35px;}
      .welcome-subtitle{font-size:15px;}.welcome-description{font-size:14px;}
      .doodle{opacity:.48;}.doodle--rna{left:6%;width:170px;}.doodle--heat{left:3%;width:170px;}.doodle--volcano{right:1%;width:190px;}.doodle--pathway{right:0;width:180px;}
    }
    @media (max-width:740px){
      body{min-width:360px;}
      :root{--sidebar-width:73px;}
      .sidebar{padding:16px 8px;}
      .brand{justify-content:center;}.brand-logo{width:42px;}
      .brand-copy,.brand-collapse,.sidebar-heading,.project-meta,.project-more,.foot-link span{display:none;}
      .new-project{width:53px;height:49px;margin:12px auto 20px;padding:0;justify-content:center;}.new-project span{display:none;}
      .projects{align-items:center;margin:0;}.project{width:54px;height:56px;min-height:56px;justify-content:center;padding:0;gap:0;}
      .sidebar-foot{align-items:center;flex-direction:column;gap:15px;}
      .topbar{padding-left:29px;}
      .project-menu{font-size:18px;}
      .doodle{opacity:.22;}
      .doodle--rna,.doodle--heat{display:none;}
      .doodle--volcano{right:-80px;}.doodle--pathway{right:-70px;}
      .welcome-card{left:51%;width:calc(100% - 50px);max-width:480px;min-height:275px;}
      .logo-tile{width:83px;height:83px;margin-bottom:14px;}.logo-tile img{height:65px;width:65px;}
      .welcome-title{font-size:clamp(25px,5vw,34px);}
      .welcome-subtitle{white-space:normal;line-height:1.4;font-size:14px;}
      .welcome-description{font-size:13px;}
      .composer{left:19px;right:12px;bottom:13px;height:72px;padding:8px;gap:7px;}
      .attach{width:42px;height:43px;}.send{width:45px;height:45px;}
      .chat-input{font-size:14px;}
      .binding{width:29px;}.binding-loop{left:-19px;}
    }
    @media (prefers-reduced-motion: reduce){ *,*::before,*::after{scroll-behavior:auto!important;} }


    /* 2026 lab-notebook refinement. Compact, restrained, and intentionally imperfect. */
    :root {
      --paper: #f7f6f0;
      --paper-raised: #fbfaf6;
      --ink: #183763;
      --ink-soft: #8290aa;
      --blue: #6699e2;
      --blue-mid: #91b9ec;
      --hand: "Noteworthy", "Bradley Hand", "Segoe Print", "Chalkboard SE", "Comic Neue", cursive;
      --notes-hand: "Bradley Hand", "Noteworthy", "Segoe Print", "Comic Neue", cursive;
    }
    .workbook { background:#f8f7f2; border-color:#d6d1c7; }
    .sidebar { background-color:#f8f7f2; }
    .brand { align-items:center; gap:12px; min-height:59px; margin:0 5px 3px; }
    .brand-logo { width:47px; height:51px; }
    .brand-copy { padding-top:0; }
    .brand-name {
      display:block; transform:none; font-size:27px; font-weight:700;
      letter-spacing:.2px; line-height:1; white-space:nowrap;
    }
    .new-project { margin-top:4px; height:52px; background:#94b9ed; border-color:#85aee8; font-size:18px; }
    .sidebar-heading { margin-top:29px; font-weight:650; }
    .project { min-height:66px; }
    .project-name { font-size:17px; font-weight:550; }
    .project-time { font-size:14px; }
    .project-selected { background:rgba(181,211,247,.29); }
    .sidebar-foot { padding-top:16px; }
    .foot-link { font-size:15px; }

    .binding { left:calc(var(--sidebar-width) - 8px); width:33px; opacity:.78; }
    .binding-loop {
      left:-9px; width:32px; height:16px; border:4px solid rgba(128,125,115,.46);
      border-left-color:rgba(116,113,102,.25);
      border-top-color:rgba(119,116,106,.46);
      border-bottom-color:rgba(124,119,110,.43);
      background:transparent; transform:rotate(-8deg);
      box-shadow:1px 1px 1.4px rgba(96,92,86,.12);
    }
    .binding-loop::before { left:8px; top:-1px; width:11px; height:2px;opacity:.23; }

    .page { background-color:#f8f7f2; background-image:radial-gradient(rgba(82,91,105,.17) .65px,transparent .9px);background-size:21px 21px; }
    .page::before { width:35px;background:linear-gradient(90deg,rgba(128,120,108,.10),transparent); }
    .topbar { justify-content:flex-end; height:65px; padding:17px 24px 0 36px; }
    .top-actions { margin-top:-4px; }
    .round-action { width:39px;height:39px; background:#e8eaf0e8;border-color:#d4d6db;box-shadow:0 2px 3px #7e787023; }
    .round-action .icon { width:20px;height:20px; }

    /* Note annotations: faint graphite-blue, lettering follows a natural hand. */
    .doodle { opacity:.66; filter:none; }
    .doodle text { font-family:var(--notes-hand);font-style:italic;font-weight:400;letter-spacing:.25px; fill:#8390a7;font-size:16px; }
    .doodle--rna { transform:rotate(-1.1deg); transform-origin:50% 50%; }
    .doodle--heat { transform:rotate(.8deg); transform-origin:50% 50%; }
    .doodle--volcano { transform:rotate(1deg);transform-origin:50% 50%; }
    .doodle--pathway { transform:rotate(-2deg);transform-origin:50% 50%; }
    .doodle .ink { stroke:#8898b0; stroke-width:1.45; }
    .doodle .pink { stroke:#efcbd0; stroke-width:2.8; }
    .doodle--rna text:first-child { font-size:23px;letter-spacing:.1px; }

    /* Wide torn sheet, not a square card: no generic UI rounding or perfect edges. */
    .welcome-paper {
      position:absolute;z-index:3;left:51%;top:46%;transform:translate(-50%,-50%) rotate(-.24deg);
      width:min(575px,62%);height:338px;
      filter:drop-shadow(1px 5px 5px rgba(77,72,65,.17));
    }
    .welcome-card {
      position:relative;left:auto;top:auto;transform:none;
      width:100%;height:100%;min-height:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:30px 23px 22px;
      background:#fbfaf6;border:0;box-shadow:none;
      clip-path:polygon(0.4% 0.3%,4% 0.6%,9% 0.1%,13% .5%,19% .2%,26% .7%,33% .3%,41% .55%,48% .15%,57% .6%,63% .1%,70% .7%,78% .3%,84% .65%,92% .2%,99.5% .4%,99.7% 8%,99.5% 17%,99.9% 25%,99.7% 35%,99.9% 46%,99.65% 53%,99.9% 66%,99.5% 77%,99.9% 89%,99.4% 99.3%,94% 99.65%,87% 99.3%,80% 99.8%,72% 99.35%,66% 99.9%,59% 99.5%,51% 99.9%,43% 99.3%,35% 99.8%,29% 99.35%,21% 99.9%,14% 99.4%,8% 99.8%,.35% 99.3%,.5% 90%,.15% 80%,.5% 70%,.2% 62%,.45% 48%,.15% 35%,.35% 21%,.1% 11%);
    }
    .welcome-card::before {
      opacity:.39; z-index:0;
      background-image:
        repeating-linear-gradient(23deg,transparent 0,transparent 3px,#dedbd437 4px,transparent 5px),
        repeating-linear-gradient(-17deg,transparent 0,transparent 8px,#dedbd323 9px,transparent 11px);
    }
    .welcome-card::after { display:none; }
    .welcome-card > * { position:relative;z-index:1; }
    .tape {
      top:-18px;left:49%;width:122px;height:28px;
      background-color:#c3d8edb4;z-index:6;opacity:.92;
      clip-path:polygon(1% 11%,8% 4%,38% 5%,73% 0%,98% 5%,96% 95%,72% 100%,29% 91%,2% 98%);
    }
    .logo-tile { width:101px;height:101px;flex-shrink:0;margin:3px auto 22px; border-color:#3e5f90;border-radius:20px;background:rgba(255,255,255,.15); }
    .logo-tile img { width:72px;height:81px; }
    .welcome-title { font-weight:700;font-size:40px;letter-spacing:-.5px;line-height:1.12;margin:0 auto 13px; }
    .welcome-title .accent { color:#70a0e5; }
    .welcome-title .accent::after { bottom:-4px;height:3px;background:#f0c4cb; }
    .welcome-subtitle {font-size:17px;font-weight:600;margin:4px auto 5px;}
    .welcome-description {font-size:16px;line-height:1.4;margin:9px auto 0;}

      .welcome-description{font-size:13px;}
      .binding-loop{left:-14px;}
    }
