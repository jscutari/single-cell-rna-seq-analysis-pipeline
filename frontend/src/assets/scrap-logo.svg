<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>SCRAP</title>
  <!-- Hand-drawn in the notebook style: ink outline with a lighter second pass,
       pencil hatching, a blue and an ink strand, and a rose highlighter swipe. -->
  <defs>
    <clipPath id="scrap-bin">
      <path d="M15.2 20.8 C16.4 32 17.6 44 18.9 54.4 Q19.4 57.2 22.2 57.1 C29 57.4 36 56.8 42.3 57 Q45.1 56.9 45.5 54.1 C46.6 43.5 48 32 49.3 20.4 Z"/>
    </clipPath>
  </defs>

  <!-- rose highlighter swipe, like the underline on page titles -->
  <path d="M9.8 51.2 Q30 46.6 54.6 50.2" stroke="#f0c4cb" stroke-width="5.2" opacity=".8"/>

  <!-- bin body: paper fill and pale-blue pencil hatching on the shaded side -->
  <path d="M15.2 20.8 C16.4 32 17.6 44 18.9 54.4 Q19.4 57.2 22.2 57.1 C29 57.4 36 56.8 42.3 57 Q45.1 56.9 45.5 54.1 C46.6 43.5 48 32 49.3 20.4 Z" fill="#fbfaf6"/>
  <g clip-path="url(#scrap-bin)" stroke="#91b9ec" stroke-width=".95" opacity=".6">
    <path d="M38.6 59.5 L51 43.2 M41.4 59.5 L52.5 45.4 M44 59.5 L53.5 47.6 M36 59.5 L49.8 41.2 M43.6 34.8 L50.6 25.6 M42.4 37.2 L50.2 27.4 M44.4 31.6 L50.8 23.4"/>
  </g>

  <!-- DNA helix: pencil rungs, one strand in blue, one in ink -->
  <path d="M27.4 29.4 H36.8 M25.6 33.9 H38.6 M27.3 38.5 H37 M27 47.4 H37.2 M25.6 51.7 H38.4" stroke="#8290aa" stroke-width="1.3"/>
  <path d="M24.6 25.6 C24.9 31 39.4 28.9 39.6 34.2 S24.3 38.3 24.5 43.3 S39.2 46.9 39.4 52.2" stroke="#6699e2" stroke-width="2.5"/>
  <path d="M39.6 25.3 C39.2 30.9 24.8 29.1 24.5 34.1 S39.6 38.4 39.4 43.4 S24.9 47.1 24.8 52.5" stroke="#183763" stroke-width="2.5"/>

  <!-- bin outline, then a lighter offset second pass -->
  <path d="M15.2 20.8 C16.4 32 17.6 44 18.9 54.4 Q19.4 57.2 22.2 57.1 C29 57.4 36 56.8 42.3 57 Q45.1 56.9 45.5 54.1 C46.6 43.5 48 32 49.3 20.4" stroke="#183763" stroke-width="2.1"/>
  <path d="M16.1 22.4 C17.2 32.6 18.3 43.6 19.6 53.6 M44.6 53.2 C45.7 43.2 47 32.4 48.4 21.8" stroke="#183763" stroke-width=".8" opacity=".32"/>

  <!-- lid: paper fill, then quick strokes that overshoot the corners -->
  <path d="M11.4 14.4 C25 13.3 40 12.6 53 12.8 Q53.9 16.2 52.5 19.6 C39 19.6 25 20 11.7 20.5 Q10.7 17.4 11.4 14.4 Z" fill="#fbfaf6"/>
  <path d="M10.4 14.5 C24 13.4 40 12.5 54 12.9" stroke="#183763" stroke-width="2.1"/>
  <path d="M11.2 20.5 C25 20 39 19.6 53.1 19.5" stroke="#183763" stroke-width="2.1"/>
  <path d="M11.3 14.3 Q10.5 17.5 11.6 20.6 M53.1 12.8 Q54 16.2 52.6 19.7" stroke="#183763" stroke-width="2"/>
  <path d="M12.4 15.6 C24 14.6 38 14 51.6 14.1" stroke="#183763" stroke-width=".8" opacity=".3"/>
  <!-- handle -->
  <path d="M26.3 13.3 Q25.8 8.7 31.7 8.4 Q37.9 8.1 37.9 12.6" stroke="#183763" stroke-width="2.1"/>
  <path d="M27.3 12.4 Q27.4 9.8 31.4 9.6" stroke="#183763" stroke-width=".8" opacity=".3"/>
</svg>
