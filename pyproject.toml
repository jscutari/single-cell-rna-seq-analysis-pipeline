[project]
name = "scrap"
version = "0.1.0"
description = "Multi-agent single-cell RNA-seq reanalysis on Nemotron Lightning + vLLM"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "openai>=1.60",
    "httpx>=0.27",
    "jupyter-client>=8.6",
    "nbformat>=5.10",
    "numpy>=2.0",
    "pymupdf>=1.24",
    "torch>=2.5",
    "transformers>=5.2",
    "sentence-transformers>=5.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pandas>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker, the scrap-sandbox image and the COVID data (Brev box)",
    "llm: needs vLLM serving on localhost:8000",
    "db: needs Postgres (docker compose up -d db; DATABASE_URL in the environment or .env)",
]

[tool.uv]
package = false
# Hackathon rule: open-source libraries must be at least 2 weeks old.
# uv ignores any release published after this date when resolving.
exclude-newer = "2026-10-03T00:00:00Z"
